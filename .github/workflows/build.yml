name: VPNYour build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build'
        type: choice
        options: [android]
        default: android
  push:
    branches: [ main ]

jobs:
  android:
    name: Android AAB (universal)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_PLATFORM: android-28
      NDK_VERSION: 27.0.11718014
      QT_VERSION: 6.10.3
      QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
      ABI: arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install desktop Qt (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}

      - name: Install Android Qt (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}

      - name: Install Android Qt (armeabi-v7a)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_armv7
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}

      - name: Install Android Qt (x86_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_x86_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install "conan==2.28.0"

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/vpnyour.keystore"

      - name: Build signed Android AAB
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/vpnyour.keystore
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          conan profile detect --force
          chmod +x deploy/build.sh
          deploy/build.sh -t android --sign --aab --abi arm64-v8a --abi armeabi-v7a --abi x86_64

      - name: Collect AAB
        run: |
          mkdir -p artifacts
          aab=$(find deploy/build -path '*outputs/bundle/release*' -name '*-release.aab' | head -1)
          echo "found signed bundle: $aab"
          if [ -z "$aab" ]; then echo "ERROR: signed .aab not found"; exit 1; fi
          cp "$aab" "artifacts/VPNYour.aab"
          # sanity: signed bundle must contain top-level META-INF signature
          if ! unzip -l "artifacts/VPNYour.aab" | grep -qE ' META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "ERROR: collected bundle is NOT signed"; exit 1
          fi
          echo "signature OK"
          ls -la artifacts

      - name: Cleanup keystore
        if: always()
        run: rm -f "${{ github.workspace }}/vpnyour.keystore"

      - name: Publish AAB to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="aab-latest"
          gh release delete "$tag" -y --cleanup-tag 2>/dev/null || true
          gh release create "$tag" artifacts/VPNYour.aab             -t "VPNYour AAB (latest)"             -n "Signed Android App Bundle for Google Play. Commit $GITHUB_SHA"             --target "$GITHUB_SHA"
