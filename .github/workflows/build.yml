name: VPNYour build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      ANDROID_PLATFORM: android-28
      NDK_VERSION: 27.0.11718014
      QT_VERSION: 6.10.3
      QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
      ABI: arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Install desktop Qt (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}

      - name: Install Android Qt (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install "conan==2.28.0"

      - name: Build Android APK
        run: |
          export QT_INSTALL_DIR="${{ runner.temp }}"
          conan profile detect --force
          chmod +x deploy/build.sh
          deploy/build.sh -t android --abi ${{ env.ABI }}

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find deploy/build -name '*.apk' -exec cp {} artifacts/ \;
          ls -la artifacts || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNYour-android-${{ env.ABI }}
          path: artifacts/*.apk
          if-no-files-found: warn
